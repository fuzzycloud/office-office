name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler bats shellcheck
      - name: Check shared product version
        run: python3 scripts/check-versions.py
      - name: Check release tag matches product version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check-versions.py --tag "$RELEASE_TAG"
      - name: Check container startup and restore rules
        run: |
          shellcheck deploy/entrypoint.sh
          bats tests/runtime/entrypoint.bats
      - run: pnpm install --frozen-lockfile
      - run: buf lint && pnpm generate
      - run: git diff --exit-code -- apps/web/src/gen
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: pnpm check
      - name: Check browser test sources
        run: pnpm exec biome check tests/e2e playwright.config.ts
      - name: Install browser for end-to-end tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise the full isolated browser suite
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            test-results
            playwright-report
          retention-days: 7
