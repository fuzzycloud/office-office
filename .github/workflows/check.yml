name: Check
on:
  push:
  pull_request:
  workflow_call:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: bufbuild/buf-setup-action@v1
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Check shared product version
        run: python3 scripts/check-versions.py
      - name: Check release tag matches product version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check-versions.py --tag "$RELEASE_TAG"
      - run: pnpm install --frozen-lockfile
      - run: buf lint && pnpm generate
      - run: git diff --exit-code -- apps/web/src/gen
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p office-server --all-targets -- -D warnings
      - run: cargo test --locked -p office-server
      - run: pnpm check && pnpm build
      - name: Install browser for UI smoke test
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise onboarding in the browser
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results
          retention-days: 7
