syntax = "proto3";
package office.v1;

service OfficeService {
  rpc GetSetupStatus(GetSetupStatusRequest) returns (GetSetupStatusResponse);
  rpc BootstrapAdmin(BootstrapAdminRequest) returns (BootstrapAdminResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc ExchangeAgentKey(ExchangeAgentKeyRequest) returns (ExchangeAgentKeyResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
  rpc SaveMember(SaveMemberRequest) returns (SaveMemberResponse);
  rpc SaveProfile(SaveProfileRequest) returns (SaveProfileResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc SaveCustomer(SaveCustomerRequest) returns (SaveCustomerResponse);
  rpc SaveProject(SaveProjectRequest) returns (SaveProjectResponse);
  rpc SaveBoard(SaveBoardRequest) returns (SaveBoardResponse);
  rpc SaveTask(SaveTaskRequest) returns (SaveTaskResponse);
  rpc ListTaskDiscussion(ListTaskDiscussionRequest) returns (ListTaskDiscussionResponse);
  rpc SaveTaskComment(SaveTaskCommentRequest) returns (SaveTaskCommentResponse);
  rpc DeleteTaskComment(DeleteTaskCommentRequest) returns (DeleteTaskCommentResponse);
  rpc CreateNotification(CreateNotificationRequest) returns (CreateNotificationResponse);
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc PollNotifications(PollNotificationsRequest) returns (PollNotificationsResponse);
  rpc UpdateNotification(UpdateNotificationRequest) returns (UpdateNotificationResponse);
  rpc ListReports(ListReportsRequest) returns (ListReportsResponse);
  rpc GetReport(GetReportRequest) returns (GetReportResponse);
  rpc SaveReport(SaveReportRequest) returns (SaveReportResponse);
  rpc ListAgentKeys(ListAgentKeysRequest) returns (ListAgentKeysResponse);
  rpc CreateAgentKey(CreateAgentKeyRequest) returns (CreateAgentKeyResponse);
  rpc RevokeAgentKey(RevokeAgentKeyRequest) returns (RevokeAgentKeyResponse);
  rpc RotateAgentKey(RotateAgentKeyRequest) returns (RotateAgentKeyResponse);
  rpc SavePost(SavePostRequest) returns (SavePostResponse);
  rpc SaveSettings(SaveSettingsRequest) returns (SaveSettingsResponse);
}

message GetSetupStatusRequest {}
message GetSetupStatusResponse { bool needs_setup = 1; bool demo_mode = 2; bool persistent_storage = 3; }
message BootstrapAdminRequest { string name = 1; string email = 2; string password = 3; string workspace_name = 4; bool load_demo_data = 5; }
message LoginRequest { string email = 1; string password = 2; }
message BootstrapAdminResponse { string token = 1; Member user = 2; int64 expires_at = 3; }
message LoginResponse { string token = 1; Member user = 2; int64 expires_at = 3; }
message ExchangeAgentKeyRequest { string key = 1; }
message ExchangeAgentKeyResponse { string token = 1; Member user = 2; int64 expires_at = 3; }
message ListRolesRequest {}
message ListRolesResponse { repeated Role roles = 1; }
message Role { string id = 1; string name = 2; string description = 3; repeated string permissions = 4; }
message GetWorkspaceRequest {}
message GetWorkspaceResponse {
  bool demo_mode = 1;
  WorkspaceSettings settings = 2;
  Member current_user = 3;
  repeated Member members = 4;
  repeated Customer customers = 5;
  repeated Project projects = 6;
  repeated SocialConnection connections = 7;
  repeated ScheduledPost posts = 8;
  repeated Activity activity = 9;
  repeated Board boards = 10;
  repeated Task tasks = 11;
  bool persistent_storage = 12;
  repeated string permissions = 13;
}
message SaveMemberRequest { Member member = 1; string password = 2; }
message SaveMemberResponse { Member member = 1; AgentKey agent_key = 2; string secret = 3; }
// Updates only the authenticated member's public profile. Empty values clear fields.
message SaveProfileRequest { string bio = 1; string avatar_url = 2; string avatar_file_id = 3; }
message SaveProfileResponse { Member member = 1; }
message SaveCustomerRequest { Customer customer = 1; }
message SaveCustomerResponse { Customer customer = 1; }
message SaveProjectRequest { Project project = 1; }
message SaveProjectResponse { Project project = 1; }
message SaveBoardRequest { Board board = 1; }
message SaveBoardResponse { Board board = 1; }
message SaveTaskRequest { Task task = 1; }
message SaveTaskResponse { Task task = 1; }
message ListReportsRequest { string query = 1; string status = 2; string project_id = 3; uint32 page_size = 4; uint32 offset = 5; }
message ListReportsResponse { repeated Report reports = 1; uint32 total_count = 2; uint32 next_offset = 3; }
message GetReportRequest { string id = 1; }
message GetReportResponse { Report report = 1; }
message SaveReportRequest { Report report = 1; uint32 expected_revision = 2; }
message SaveReportResponse { Report report = 1; }
message ListAgentKeysRequest {}
message ListAgentKeysResponse { repeated AgentKey keys = 1; }
message CreateAgentKeyRequest {
  string name = 1;
  // Legacy compatibility only; ignored. The member role determines access.
  repeated string scopes = 2;
  int32 expires_in_days = 3;
  string member_id = 4;
}
message CreateAgentKeyResponse { AgentKey key = 1; string secret = 2; }
message RevokeAgentKeyRequest { string id = 1; }
message RevokeAgentKeyResponse { AgentKey key = 1; }
message RotateAgentKeyRequest { string member_id = 1; }
message RotateAgentKeyResponse { AgentKey key = 1; string secret = 2; }
message SavePostRequest { ScheduledPost post = 1; }
message SavePostResponse { ScheduledPost post = 1; }
message SaveSettingsRequest { WorkspaceSettings settings = 1; }
message SaveSettingsResponse { WorkspaceSettings settings = 1; }

message Member {
  string id = 1;
  string name = 2;
  string email = 3;
  string job_title = 4;
  string department = 5;
  string role = 6;
  string status = 7;
  // Legacy compatibility only; derived from role, never an override.
  repeated string access = 8;
  // Empty means human for events created before explicit member kinds.
  string kind = 9;
  string bio = 10;
  // Optional external HTTPS image URL; mutually exclusive with avatar_file_id.
  string avatar_url = 11;
  string avatar_file_id = 12;
}
message Customer {
  string id = 1;
  string name = 2;
  string company = 3;
  string email = 4;
  string status = 5;
  string owner_id = 6;
  string notes = 7;
}
message Project {
  string id = 1;
  string name = 2;
  string customer_id = 3;
  string owner_id = 4;
  string status = 5;
  string summary = 6;
  string target_date = 7;
}
message Board {
  string id = 1;
  string project_id = 2;
  string name = 3;
  repeated string columns = 4;
}
message Task {
  string id = 1;
  string project_id = 2;
  string board_id = 3;
  string column = 4;
  string title = 5;
  string description = 6;
  string assignee_id = 7;
  string priority = 8;
  string due_date = 9;
  uint32 comment_count = 10;
}
message ReportSource { string title = 1; string url = 2; }
message Report {
  string id = 1;
  string title = 2;
  string summary = 3;
  string body = 4;
  string kind = 5;
  string status = 6;
  string topic = 7;
  string period = 8;
  string project_id = 9;
  string task_id = 10;
  string author_id = 11;
  string author_name = 12;
  int64 created_at = 13;
  int64 updated_at = 14;
  string updated_by = 15;
  uint32 revision = 16;
  repeated ReportSource sources = 17;
}
message AgentKey {
  string id = 1;
  string name = 2;
  // Legacy metadata only; ignored for authorization.
  repeated string scopes = 3;
  int64 expires_at = 4;
  int64 created_at = 5;
  bool revoked = 6;
  string member_id = 7;
  string issued_by = 8;
}
message SocialConnection {
  string id = 1;
  string platform = 2;
  string name = 3;
  string status = 4;
  bool demo = 5;
}
message ScheduledPost {
  string id = 1;
  string connection_id = 2;
  string content = 3;
  string scheduled_at = 4;
  string status = 5;
  string author_id = 6;
}
message Activity {
  string id = 1;
  string kind = 2;
  string summary = 3;
  string actor_name = 4;
  string occurred_at = 5;
}
message WorkspaceSettings { string workspace_name = 1; string default_theme = 2; string timezone = 3; }

message TaskComment {
  string id = 1;
  string task_id = 2;
  string body = 3;
  string author_id = 4;
  string author_name = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  uint32 revision = 8;
  bool deleted = 9;
  string actor_kind = 10;
}
message TaskActivity {
  string id = 1;
  string task_id = 2;
  string kind = 3;
  string summary = 4;
  string actor_id = 5;
  string actor_name = 6;
  string actor_kind = 7;
  int64 occurred_at = 8;
}
message ListTaskDiscussionRequest { string task_id = 1; }
message ListTaskDiscussionResponse { repeated TaskComment comments = 1; repeated TaskActivity activity = 2; }
message SaveTaskCommentRequest { string task_id = 1; string comment_id = 2; string body = 3; uint32 expected_revision = 4; }
message SaveTaskCommentResponse { TaskComment comment = 1; }
message DeleteTaskCommentRequest { string task_id = 1; string comment_id = 2; uint32 expected_revision = 3; }
message DeleteTaskCommentResponse { TaskComment comment = 1; }

// File bytes live in private object storage; metadata and soft deletion are events.
message FileRecord {
  string id = 1;
  string name = 2;
  string content_type = 3;
  uint64 size_bytes = 4;
  // projects, reports or profile. Empty record_id means a module-wide attachment.
  string module = 5;
  string record_id = 6;
  string uploaded_by = 7;
  string created_at = 8;
  bool deleted = 9;
  uint32 revision = 10;
  string sha256 = 11;
}
message ListFilesRequest { string module = 1; string record_id = 2; }
message ListFilesResponse { repeated FileRecord files = 1; bool storage_configured = 2; }
message DeleteFileRequest { string id = 1; uint32 expected_revision = 2; }
message DeleteFileResponse { FileRecord file = 1; }

// Personal attention records; status never changes a linked task's status.
message Notification {
  string id = 1;
  string recipient_id = 2;
  string sender_id = 3;
  string title = 4;
  string body = 5;
  string kind = 6;
  string source_kind = 7;
  string source_id = 8;
  string status = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
  int64 read_at = 12;
  uint32 revision = 13;
  uint64 sequence = 14;
  string request_id = 15;
  string claim_id = 16;
  string updated_by = 17;
  string note = 18;
  uint64 created_sequence = 19;
}
message CreateNotificationRequest {
  string request_id = 1;
  string title = 2;
  string body = 3;
  string kind = 4;
  repeated string recipient_ids = 5;
  string source_kind = 6;
  string source_id = 7;
}
message CreateNotificationResponse { repeated Notification notifications = 1; }
message ListNotificationsRequest { string scope = 1; string status = 2; uint32 page_size = 3; uint32 offset = 4; }
message ListNotificationsResponse { repeated Notification notifications = 1; uint32 total_count = 2; uint32 next_offset = 3; }
// Decimal cursor. Poll returns immutable change snapshots and never marks read.
message PollNotificationsRequest { string after_cursor = 1; uint32 page_size = 2; }
message PollNotificationsResponse { repeated Notification notifications = 1; string next_cursor = 2; bool has_more = 3; }
message UpdateNotificationRequest { string id = 1; uint32 expected_revision = 2; string action = 3; string claim_id = 4; string note = 5; }
message UpdateNotificationResponse { Notification notification = 1; }
