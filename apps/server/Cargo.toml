[package]
name = "office-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = "0.8"
buffa = "0.8"
connectrpc = { version = "0.8", features = ["server", "axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
connectrpc-build = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
